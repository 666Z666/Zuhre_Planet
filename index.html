<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Zühre Planet | Seçkin Yörünge</title>
    <meta name="description" content="Zühre Planet — Türkiye'nin seçkin ilan platformu. Doğrulanmış profiller, gizlilik odaklı ve güvenli iletişim." />
    <meta name="author" content="Zühre Planet" />
    <!-- 18+ içerik: arama motoru indekslemesi yayın öncesi hukuki onaya göre açılmalı -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="rating" content="adult" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zühre Planet" />
    <meta property="og:title" content="Zühre Planet | Seçkin Yörünge" />
    <meta property="og:description" content="Doğrulanmış profiller, gizlilik odaklı ve güvenli iletişim." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zühre Planet | Seçkin Yörünge" />
    <meta name="twitter:image" content="/twitter-image.jpg" />

    <!-- İkonlar -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/brand/emblem.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#04140f" />

    <!--
      Güvenlik başlıkları (CSP, HSTS, X-Frame-Options) sunucu/hosting katmanında
      verilir: server-headers.config.js, vercel.json, netlify.toml, nginx.conf.
      Meta CSP burada bilinçli olarak YOK — eski "*" joker CSP tüm korumayı devre dışı bırakıyordu.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
